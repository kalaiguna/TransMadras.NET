<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TransMadras — Tamil Transliteration</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f13;
      color: #e2e2e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 2rem 2rem 1rem;
      border-bottom: 1px solid #2a2a36;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #c084fc;
    }

    header p {
      margin-top: 0.3rem;
      font-size: 0.85rem;
      color: #6b6b7e;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      padding: 2rem;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
    }

    @media (max-width: 680px) {
      main { grid-template-columns: 1fr; }
    }

    .panel {
      background: #18181f;
      border: 1px solid #2a2a36;
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .panel h2 {
      font-size: 1rem;
      font-weight: 600;
      color: #a78bfa;
    }

    .panel h2 span {
      font-size: 0.75rem;
      font-weight: 400;
      color: #6b6b7e;
      margin-left: 0.4rem;
    }

    label {
      font-size: 0.78rem;
      color: #6b6b7e;
      display: block;
      margin-bottom: 0.3rem;
    }

    textarea {
      width: 100%;
      height: 120px;
      background: #0f0f13;
      border: 1px solid #2a2a36;
      border-radius: 8px;
      color: #e2e2e8;
      font-family: 'Noto Serif Tamil', Georgia, serif;
      font-size: 1.1rem;
      padding: 0.75rem;
      resize: vertical;
      outline: none;
      transition: border-color 0.15s;
    }

    textarea:focus { border-color: #7c3aed; }
    textarea[readonly] {
      background: #141419;
      color: #c084fc;
      cursor: default;
    }

    .row { display: flex; gap: 0.6rem; align-items: center; }

    button {
      padding: 0.55rem 1.2rem;
      border-radius: 7px;
      border: none;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary {
      background: #7c3aed;
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) { background: #6d28d9; }

    .btn-copy {
      background: #2a2a36;
      color: #a78bfa;
      margin-left: auto;
    }
    .btn-copy:hover:not(:disabled) { background: #34344a; }

    .error {
      font-size: 0.8rem;
      color: #f87171;
      min-height: 1rem;
    }

    footer {
      text-align: center;
      padding: 1rem;
      font-size: 0.75rem;
      color: #3a3a4e;
      border-top: 1px solid #1e1e28;
    }

    footer a { color: #7c3aed; text-decoration: none; }
  </style>
</head>
<body>

<header>
  <h1>TransMadras</h1>
  <p>Tamil Unicode ↔ ISO 15919 transliteration &nbsp;·&nbsp; Original class by C. Gunasekaran, 2007</p>
</header>

<main>
  <!-- Panel 1: Tamil → Style -->
  <div class="panel">
    <h2>Tamil Unicode → Transliteration <span>ISO 15919</span></h2>

    <div>
      <label for="tamilInput">Input — Tamil Unicode</label>
      <textarea id="tamilInput" placeholder="தமிழ் இங்கே தட்டச்சு செய்யுங்கள்…" spellcheck="false"></textarea>
    </div>

    <div class="row">
      <button class="btn-primary" onclick="convert('to-style')">Convert →</button>
      <button class="btn-copy" onclick="copy('styleOutput')">Copy</button>
    </div>

    <div id="styleError" class="error"></div>

    <div>
      <label for="styleOutput">Result — Transliteration</label>
      <textarea id="styleOutput" readonly placeholder="tamiḻ iṅkē taṭṭaccu ceyyuṅkaḷ…"></textarea>
    </div>
  </div>

  <!-- Panel 2: Style → Tamil Unicode -->
  <div class="panel">
    <h2>Transliteration → Tamil Unicode <span>ISO 15919</span></h2>

    <div>
      <label for="styleInput">Input — ISO 15919 Transliteration</label>
      <textarea id="styleInput" placeholder="tamiḻ iṅkē taṭṭaccu ceyyuṅkaḷ…" spellcheck="false"></textarea>
    </div>

    <div class="row">
      <button class="btn-primary" onclick="convert('to-unicode')">Convert →</button>
      <button class="btn-copy" onclick="copy('tamilOutput')">Copy</button>
    </div>

    <div id="unicodeError" class="error"></div>

    <div>
      <label for="tamilOutput">Result — Tamil Unicode</label>
      <textarea id="tamilOutput" readonly placeholder="தமிழ் இங்கே தட்டச்சு செய்யுங்கள்…"></textarea>
    </div>
  </div>
</main>

<footer>
  Tamil Transliteration API &nbsp;·&nbsp; <a href="/scalar/v1">API Reference (Scalar)</a>
</footer>

<script>
  async function convert(direction) {
    const isToStyle = direction === 'to-style';
    const inputEl  = document.getElementById(isToStyle ? 'tamilInput'  : 'styleInput');
    const outputEl = document.getElementById(isToStyle ? 'styleOutput' : 'tamilOutput');
    const errorEl  = document.getElementById(isToStyle ? 'styleError'  : 'unicodeError');

    const text = inputEl.value.trim();
    errorEl.textContent = '';
    outputEl.value = '';

    if (!text) { errorEl.textContent = 'Please enter some text first.'; return; }

    try {
      const res = await fetch(`/api/transliterate/${direction}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });

      if (!res.ok) throw new Error(`Server returned ${res.status}`);
      const data = await res.json();
      outputEl.value = data.result;
    } catch (err) {
      errorEl.textContent = `Error: ${err.message}`;
    }
  }

  async function copy(id) {
    const val = document.getElementById(id).value;
    if (!val) return;
    try {
      await navigator.clipboard.writeText(val);
    } catch {
      const el = document.getElementById(id);
      el.select();
      document.execCommand('copy');
    }
  }

  document.getElementById('tamilInput').addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') convert('to-style');
  });
  document.getElementById('styleInput').addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') convert('to-unicode');
  });
</script>

</body>
</html>
